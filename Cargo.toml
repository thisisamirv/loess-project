[workspace.package]
rust-version = "1.89"

[workspace]
resolver = "3"
members = [
    "crates/loess-rs",
    "crates/fastLoess",
    "bindings/python",
    "bindings/julia",
    "bindings/nodejs",
    "bindings/wasm",
    "bindings/cpp",
    "bindings/go",
    "bindings/java",
    "validation/rust_tests",
]
exclude = ["bindings/r/src/vendor"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# C/C++ binding release profile: panic=abort ensures no GCC unwind symbols
# (_Unwind_Resume, _Unwind_RaiseException, etc.) are embedded in the static
# archive or DLL, making the artifact linkable by MSVC, Clang, and GCC alike.
[profile.release-c]
inherits = "release"
panic = "abort"
