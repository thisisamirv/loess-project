name: CI — Rust

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASAN_OPTIONS: detect_leaks=0:strict_init_order=1

jobs:
  ci:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust GNU (Windows)
        if: matrix.os == 'windows-latest'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu

      - name: Install GNU Make (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ matrix.os }}

      - name: Format
        run: |
          cargo fmt -p loess-rs --all -- --check
          cargo fmt -p fastLoess --all -- --check

      - name: Clippy
        run: |
          cargo clippy -p loess-rs --all-targets -- -D warnings
          cargo clippy -p fastLoess --all-targets --features dev -- -D warnings

      - name: Test (loess-rs)
        shell: bash
        run: |
          cargo test -q -p loess-rs --test loess-rs --features dev
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo test -q -p loess-rs --test loess-rs --features dev --no-default-features
          fi

      - name: Build (fastLoess)
        run: cargo build -p fastLoess --features dev

      - name: Test (fastLoess)
        run: cargo test -q -p fastLoess --test fastLoess --features dev

      - name: Docs
        run: |
          cargo doc -p loess-rs --no-deps
          cargo doc -p fastLoess --no-deps --features dev
        env:
          RUSTDOCFLAGS: -D warnings

      - name: make loess-rs-dev
        run: make loess-rs-dev

      - name: make fastLoess-dev
        run: make fastLoess-dev

  asan:
    name: Rust ASAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-asan
      - name: Test (ASAN)
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo test \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p loess-rs --test loess-rs
          cargo test \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fastLoess --test fastLoess --features dev
