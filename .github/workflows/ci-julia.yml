name: CI — Julia

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASAN_OPTIONS: detect_leaks=0:strict_init_order=1

jobs:
  ci:
    name: Julia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"

      - name: Install Rust GNU (Windows)
        if: matrix.os == 'windows-latest'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu

      - name: Install GNU Make (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: julia-${{ matrix.os }}

      - name: Build
        working-directory: bindings/julia
        run: cargo build --release

      - name: Verify Exports
        if: matrix.os == 'ubuntu-latest'
        run: |
          nm -D target/release/libfastloess_jl.so | grep -q jl_loess_fit || exit 1
          nm -D target/release/libfastloess_jl.so | grep -q jl_streaming_loess_new || exit 1
          nm -D target/release/libfastloess_jl.so | grep -q jl_online_loess_new || exit 1
          nm -D target/release/libfastloess_jl.so | grep -q jl_loess_free_result || exit 1

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export FASTLOESS_LIB="target/release/fastloess_jl.dll"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            export FASTLOESS_LIB="target/release/libfastloess_jl.dylib"
          else
            export FASTLOESS_LIB="target/release/libfastloess_jl.so"
          fi
          julia -e 'using Pkg; Pkg.activate("bindings/julia/julia"); Pkg.instantiate(); include("bindings/julia/tests/test_FastLOESS.jl")'

      - name: Lint
        working-directory: bindings/julia
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: make julia-dev
        run: make julia-dev

  asan:
    name: Julia ASAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: julia-asan
      - name: Install System Dependencies
        run: sudo apt-get install -y --no-install-recommends clang lld
      - name: Build (ASAN)
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo build \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fastloess-jl --release
