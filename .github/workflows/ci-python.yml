name: CI — Python

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASAN_OPTIONS: detect_leaks=0:strict_init_order=1

jobs:
  ci:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install GNU Make (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}

      - name: Build & Install
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy ruff matplotlib
          pip install .

      - name: Lint (Ruff)
        working-directory: bindings/python
        run: |
          ruff format --check python/fastloess/ tests/
          ruff check python/fastloess/ tests/

      - name: Test
        working-directory: bindings/python
        run: pytest tests/ -v

      - name: make python
        run: make python

  asan:
    name: Python ASAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-asan
      - name: Install System Dependencies
        run: sudo apt-get install -y --no-install-recommends clang lld
      - name: Build (ASAN)
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo build \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fastLoess-py --release
