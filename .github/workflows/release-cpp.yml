name: Release C++

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload assets to (e.g., v0.99.8)"
        required: true
        type: string
      commit:
        description: "Commit SHA to build from (optional, defaults to the triggering ref)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libfastloess.so
            asset_name: libfastloess-linux-x64.so
            target_dir: target/release
          - os: ubuntu-24.04-arm
            artifact_name: libfastloess.so
            asset_name: libfastloess-linux-arm64.so
            target_dir: target/release
          - os: windows-latest
            artifact_name: fastloess.dll
            asset_name: fastloess-win32-x64.dll
            target_dir: target/release
          - os: windows-11-arm
            artifact_name: fastloess.dll
            asset_name: fastloess-win32-arm64.dll
            target_dir: target/release
          - os: macos-13
            artifact_name: libfastloess.dylib
            asset_name: libfastloess-macos-x64.dylib
            target_dir: target/release
          - os: macos-latest
            artifact_name: libfastloess.dylib
            asset_name: libfastloess-macos-arm64.dylib
            target_dir: target/release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build C++ Library
        working-directory: bindings/cpp
        run: cargo build --release --lib

      - name: Prepare Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          # Rust/Cargo naming: libfastloess_cpp.so or .dylib
          mv target/release/libfastloess_cpp.so ${{ matrix.asset_name }} 2>/dev/null || mv target/release/libfastloess_cpp.dylib ${{ matrix.asset_name }}

      - name: Prepare Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows: fastloess_cpp.dll
          mv target/release/fastloess_cpp.dll ${{ matrix.asset_name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: ${{ matrix.asset_name }}

      - name: Upload Header to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: bindings/cpp/include/fastloess.hpp

  spack-release:
    name: Update Spack recipe
    runs-on: ubuntu-latest
    steps:
      # release/workflow_dispatch events check out a detached HEAD at the
      # release tag by default; check out the default branch instead so the
      # "Commit updated recipe" step below has something to push to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update package.py with new version + sha256
        run: |
          python dev/spack_release.py \
            --repo thisisamirv/loess-project \
            --tag "${{ github.event.release.tag_name || github.event.inputs.tag }}" \
            --package-file bindings/cpp/spack/package.py

      - name: Commit updated recipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/cpp/spack/package.py
          git commit -m "cpp: update Spack recipe for ${{ github.event.release.tag_name || github.event.inputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Open PR to spack/spack-packages
        env:
          GH_TOKEN: ${{ secrets.SPACK_PACKAGES_PAT }}
        run: |
          bash dev/spack_open_pr.sh fastloess-cpp bindings/cpp/spack/package.py "${{ github.event.release.tag_name || github.event.inputs.tag }}"
