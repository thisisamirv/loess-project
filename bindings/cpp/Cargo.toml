[package]
name = "fastloess-cpp"
version = "3.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/loess-project"
documentation = "https://thisisamirv.github.io/loess-project/cpp/"
rust-version.workspace = true
readme = "README.md"
description = "High-performance LOESS (Locally Estimated Scatterplot Smoothing)"
keywords = ["loess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

[lib]
name = "fastloess_cpp"
crate-type = ["cdylib", "staticlib"]

[dependencies]
fastLoess = { path = "../../crates/fastLoess", version = "3.1", features = [
    "dev",
] }

[build-dependencies]
cbindgen = "0.29"
