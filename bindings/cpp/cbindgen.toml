no_includes = true
header = "#include <stdint.h>\n#include <stddef.h>"
include_guard = "FASTLOESS_H"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
include = ["CppLoessResult"]
# Prefix applies to generated C types (e.g. fastloess_CppLoess). Exported
# function names already use the fastloess_ ABI prefix in Rust, and
# renaming_overrides_prefixing keeps cbindgen from doubling that prefix.
prefix = "fastloess_"
renaming_overrides_prefixing = true

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
