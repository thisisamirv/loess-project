[package]
name = "fastloess-jl"
version = "1.1.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/loess-project"
homepage = "https://github.com/thisisamirv/loess-project"
documentation = "https://thisisamirv.github.io/loess-project/julia/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOESS (Locally Estimated Scatterplot Smoothing)"
keywords = ["loess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

[dependencies]
fastLoess = { path = "../../crates/fastLoess", version = "1.1", features = [
    "dev",
] }

[lib]
name = "fastloess_jl"
crate-type = ["cdylib"]
