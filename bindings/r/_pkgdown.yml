url: https://thisisamirv.github.io/loess-project/r/
template:
  package: srr
  bootstrap: 5
  bootswatch: flatly

development:
  mode: auto

reference:
  - title: Core LOESS Interface
    desc: Main R6 classes for LOESS smoothing.
    contents:
      - rfastloess-package
      - Loess
      - StreamingLoess
      - OnlineLoess
  - title: Results and Utilities
    desc: Objects returned by fit methods and helper functions.
    contents:
      - fit
      - process_chunk
      - finalize
      - add_point
      - plot.LoessResult
      - print.Loess
      - print.LoessResult
      - print.OnlineLoess
      - print.StreamingLoess
  - title: Types
    desc: Helper types for documentation.
    contents:
      - Nullable

articles:
  - title: Introduction
    contents:
      - installation
      - quickstart
      - concepts
  - title: User Guide
    contents:
      - parameters
      - adapter-choice
      - batch
      - streaming
      - online
      - degree
      - dimensions
      - intervals
      - cross-validation
  - title: Weight & Robustness
    contents:
      - kernels
      - robustness
      - scaling
      - custom-weights
  - title: Advanced
    contents:
      - boundary
      - merge
  - title: Use Cases
    contents:
      - use-case-genomics
      - use-case-time-series
      - use-case-real-time
  - title: Performance
    contents:
      - benchmarks

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/thisisamirv/loess-project
      aria-label: GitHub
    intro:
      text: Get Started
      href: articles/quickstart.html
