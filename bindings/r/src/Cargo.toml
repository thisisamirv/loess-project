[package]
name = "rfastloess"
version = "1.2.0"
authors = ["Amir Valizadeh <thisisamirv@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisisamirv/loess-project"
homepage = "https://github.com/thisisamirv/loess-project"
documentation = "https://thisisamirv.github.io/loess-project/r/"
rust-version = "1.89"
readme = "README.md"
description = "High-performance LOESS (Locally Estimated Scatterplot Smoothing)"
keywords = ["loess", "smoothing", "statistics", "regression", "bioinformatics"]
categories = ["science", "algorithms"]

# Build
[dependencies]
fastLoess = { path = "vendor/fastLoess", features = ["dev"] }
extendr-api = "0.9"

[lib]
name = "rfastloess"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = []
dev = []

[profile.release]
strip = "symbols"

[workspace]








